<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-label="hakobuのアーキテクチャ図">
  <title>hakobuのアーキテクチャ。リリース側はビルドと署名つき公開を行い、静的リポジトリを介して、利用側のUpdaterが検証・差分適用・原子的入れ替えを行う。</title>
  <style>
    svg {
      --ink: #1f2328;
      --accent: #c66b2e;
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e6edf3; }
    }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
    .accent-box { fill: none; stroke: var(--accent); stroke-width: 2; }
    .label { font: 600 15px "Hiragino Sans", "Noto Sans JP", sans-serif; fill: currentColor; }
    .zone-label { font: 600 13px "Hiragino Sans", "Noto Sans JP", sans-serif; fill: currentColor; opacity: 0.6; }
    .note { font: 12px "Hiragino Sans", "Noto Sans JP", sans-serif; fill: currentColor; opacity: 0.65; }
    .mono { font: 12px "SF Mono", Menlo, monospace; fill: currentColor; opacity: 0.8; }
    .flow { stroke: currentColor; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .sig { stroke: var(--accent); stroke-width: 1.5; fill: none; marker-end: url(#arrow-accent); stroke-dasharray: 5 4; }
    .sig-label { font: 12px "Hiragino Sans", "Noto Sans JP", sans-serif; fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c66b2e"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="270" height="430" rx="10" class="zone"/>
  <text x="40" y="48" class="zone-label">リリース担当者の手元</text>

  <rect x="40" y="70" width="230" height="80" rx="8" class="box"/>
  <text x="60" y="98" class="label">プロジェクト</text>
  <text x="60" y="120" class="mono">hakobu.toml + ソースツリー</text>

  <rect x="40" y="190" width="230" height="90" rx="8" class="box"/>
  <text x="60" y="218" class="label">hakobu build</text>
  <text x="60" y="240" class="note">決定的tar.gz(mtime・所有者を固定)</text>
  <text x="60" y="258" class="note">ファイルごとのSHA-256指紋</text>

  <rect x="40" y="320" width="230" height="100" rx="8" class="accent-box"/>
  <text x="60" y="348" class="label">hakobu publish</text>
  <text x="60" y="370" class="note">直近リリースとの差分パッチ生成</text>
  <text x="60" y="388" class="note">Ed25519署名(秘密鍵)</text>

  <rect x="340" y="150" width="210" height="190" rx="10" class="box"/>
  <text x="360" y="180" class="label">静的リポジトリ</text>
  <text x="360" y="204" class="mono">manifest.json(+署名)</text>
  <text x="360" y="226" class="mono">archives/*.tar.gz</text>
  <text x="360" y="248" class="mono">patches/*-to-*.tar.gz</text>
  <text x="360" y="280" class="note">ただのファイル置き場なので</text>
  <text x="360" y="298" class="note">Webサーバーや S3 にそのまま置ける</text>

  <rect x="600" y="20" width="260" height="430" rx="10" class="zone"/>
  <text x="620" y="48" class="zone-label">利用者のマシン</text>

  <rect x="620" y="70" width="220" height="110" rx="8" class="box"/>
  <text x="640" y="98" class="label">Updater.check()</text>
  <text x="640" y="120" class="note">マニフェストの署名を検証してから</text>
  <text x="640" y="138" class="note">読む。新しければ更新計画を返す</text>

  <rect x="620" y="210" width="220" height="120" rx="8" class="accent-box"/>
  <text x="640" y="238" class="label">Updater.apply()</text>
  <text x="640" y="260" class="note">ハッシュ+署名の検証</text>
  <text x="640" y="278" class="note">複製へ差分適用、指紋を照合</text>
  <text x="640" y="296" class="note">renameで原子的に入れ替え</text>

  <rect x="620" y="360" width="220" height="60" rx="8" class="box"/>
  <text x="640" y="388" class="label">インストール先</text>
  <text x="640" y="406" class="mono">.hakobu-state.json</text>

  <path d="M 155 150 L 155 190" class="flow"/>
  <path d="M 155 280 L 155 320" class="flow"/>
  <path d="M 270 370 C 320 370 330 280 340 250" class="flow"/>
  <path d="M 550 200 C 580 180 590 150 620 125" class="flow"/>
  <path d="M 550 270 L 620 270" class="flow"/>
  <path d="M 730 330 L 730 360" class="flow"/>

  <path d="M 130 420 C 200 460 540 460 700 430" class="sig"/>
  <text x="330" y="442" class="sig-label">公開鍵だけをアプリ側へ同梱する</text>
</svg>
